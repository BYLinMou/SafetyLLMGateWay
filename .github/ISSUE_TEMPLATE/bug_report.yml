name: Bug report
description: Report a reproducible defect once implementation starts.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Use this form for behavior that is implemented but not working as intended.
  - type: textarea
    id: current_behavior
    attributes:
      label: Current behavior
      description: What happens now?
      placeholder: Describe the observed behavior and any visible error.
    validations:
      required: true
  - type: textarea
    id: expected_behavior
    attributes:
      label: Expected behavior
      description: What should happen instead?
      placeholder: Describe the expected result.
    validations:
      required: true
  - type: textarea
    id: reproduction_steps
    attributes:
      label: Reproduction steps
      description: Provide the smallest reliable sequence that triggers the defect.
      placeholder: |
        1. Run ...
        2. Configure ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include relevant versions, platform details, and runtime context.
      value: |
        - OS:
        - Runtime:
        - Project version or commit:
        - CLI/API/config path:
    validations:
      required: true
  - type: textarea
    id: logs_screenshots
    attributes:
      label: Logs/screenshots
      description: Add logs, stack traces, screenshots, or terminal output if available.
      placeholder: Paste relevant output here. Remove secrets before posting.
    validations:
      required: false
