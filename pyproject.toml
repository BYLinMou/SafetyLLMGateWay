[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "safety-llm-gateway"
version = "0.1.0"
description = "A local safety gateway for LLM API traffic."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[project.scripts]
lsg = "lsg_gateway.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/lsg_gateway"]

[tool.pytest.ini_options]
testpaths = ["tests"]
